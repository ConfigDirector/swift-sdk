name: ci

on:
  push:
    # Every branch, but not tags: a release tag will run its own workflow, which builds and tests
    # the same commit before it publishes anything.
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  # Lets the release workflow run this exact matrix before it publishes anything, rather than
  # keeping a second copy of it in step with this one.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build + Test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # The runner image ships several Xcodes and its default moves over time, including onto
      # betas. Pinning to the latest stable one keeps a toolchain change from arriving unannounced.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: swift --version

      - run: swift build

      - run: swift test

  lint:
    name: Lint
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Neither tool is guaranteed to be on the runner image, and which version is decides what
      # counts as correctly formatted, so both are installed rather than assumed.
      - run: brew install swiftlint swiftformat

      - run: swiftformat --lint .

      # --strict fails on warnings, which is the whole point of running it here.
      - run: swiftlint lint --strict

  platforms:
    # The tests only run on the host, so this is what stops a change compiling on macOS and
    # breaking on a platform where an API is unavailable or isolated to the main actor.
    name: Build (${{ matrix.name }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            sdk: iphoneos
            target: arm64-apple-ios15.0
          - name: tvOS
            sdk: appletvos
            target: arm64-apple-tvos15.0
          - name: watchOS
            sdk: watchos
            target: arm64_32-apple-watchos8.0
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: |
          swift build \
            --sdk "$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)" \
            -Xswiftc -target -Xswiftc ${{ matrix.target }}

  docs:
    # A documentation site is generated from the SDK's doc comments, and `xcodebuild docbuild`
    # exits 0 on a broken symbol link — it just renders the link as plain text. The diagnostics
    # file it writes is the only place that shows up, so the check is what actually gates it.
    name: Documentation
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: |
          xcodebuild docbuild \
            -scheme swift-client-sdk \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .docs-build \
            -quiet

      - run: .github/scripts/check-docs-diagnostics.sh .docs-build

  sample:
    # The samples' project depends on the released package the way a consumer's app would, so the
    # local-override workspace is what gets built here: it swaps in this checkout, and a breaking
    # change to the public API fails here instead of reaching someone's app. No SDK key needed.
    name: Sample app (${{ matrix.name }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            scheme: ConfigDirectorSample
            destination: generic/platform=iOS Simulator
          - name: macOS
            scheme: ConfigDirectorSampleMac
            destination: generic/platform=macOS
          - name: tvOS
            scheme: ConfigDirectorSampleTV
            destination: generic/platform=tvOS Simulator
          - name: watchOS
            scheme: ConfigDirectorSampleWatch
            destination: generic/platform=watchOS Simulator
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: |
          xcodebuild build \
            -workspace Samples/ConfigDirectorSample-Local.xcworkspace \
            -scheme ${{ matrix.scheme }} \
            -destination '${{ matrix.destination }}' \
            -quiet
