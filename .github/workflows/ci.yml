name: ci

on:
  push:
    # Every branch, but not tags: a release tag will run its own workflow, which builds and tests
    # the same commit before it publishes anything.
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build + Test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # The runner image ships several Xcodes and its default moves over time, including onto
      # betas. Pinning to the latest stable one keeps a toolchain change from arriving unannounced.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: swift --version

      - run: swift build

      - run: swift test

  lint:
    name: Lint
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Neither tool is guaranteed to be on the runner image, and which version is decides what
      # counts as correctly formatted, so both are installed rather than assumed.
      - run: brew install swiftlint swiftformat

      - run: swiftformat --lint .

      # --strict fails on warnings, which is the whole point of running it here.
      - run: swiftlint lint --strict

  platforms:
    # The tests only run on the host, so this is what stops a change compiling on macOS and
    # breaking on a platform where an API is unavailable or isolated to the main actor.
    name: Build (${{ matrix.name }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            sdk: iphoneos
            target: arm64-apple-ios15.0
          - name: tvOS
            sdk: appletvos
            target: arm64-apple-tvos15.0
          - name: watchOS
            sdk: watchos
            target: arm64_32-apple-watchos8.0
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: |
          swift build \
            --sdk "$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)" \
            -Xswiftc -target -Xswiftc ${{ matrix.target }}

  sample:
    # The sample consumes the SDK as a local package, so a breaking change to the public API fails
    # here instead of reaching someone's app. It needs no SDK key to build.
    name: Sample app
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: |
          xcodebuild build \
            -project Samples/ConfigDirectorSample.xcodeproj \
            -scheme ConfigDirectorSample \
            -destination 'generic/platform=iOS Simulator' \
            -quiet
